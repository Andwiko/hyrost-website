<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil — Hyrost</title>
  <link rel="stylesheet" href="../dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="main-content" style="max-width:720px;margin:40px auto;padding:24px;">
    <a href="../dashboard.html" class="btn-header-action"><i class="fas fa-arrow-left"></i> Dashboard</a>
    <div class="widget-card" style="margin-top:20px;" id="profileCard">
      <div class="loading-spinner"><i class="fas fa-spinner"></i> Memuat profil...</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const username = params.get('u') || params.get('username');
    if (!username) {
      document.getElementById('profileCard').innerHTML = '<p>Username tidak ditemukan</p>';
    } else {
      fetch('/api/features/profile/' + encodeURIComponent(username))
        .then(r => r.json())
        .then(data => {
          const el = document.getElementById('profileCard');
          if (!data.success) { el.innerHTML = '<p>Profil tidak ditemukan</p>'; return; }
          const p = data.profile;
          el.innerHTML = `
            <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
              <img src="${p.avatar_url || ''}" alt="" style="width:80px;height:80px;border-radius:16px;" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.username)}'" />
              <div>
                <h1 style="margin:0;">${p.username}</h1>
                <p style="color:var(--accent-cyan);">${p.role}</p>
                <p style="color:var(--text-dim);font-size:0.85rem;">Member sejak ${new Date(p.created_at).toLocaleDateString('id-ID')}</p>
              </div>
            </div>
            <div style="display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;">
              <span><i class="fas fa-coins"></i> ${p.coin_bronze} Bronze</span>
              <span><i class="fas fa-comments"></i> ${p.threadCount} Thread</span>
              <span><i class="fas fa-fire"></i> Streak ${p.streak_count || 0}</span>
            </div>
            <div style="margin-top:20px;">
              <h3>Achievements</h3>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                ${(p.achievements || []).map(a => `<span class="badge badge-vip"><i class="fas ${a.icon}"></i> ${a.title}</span>`).join('') || '<span style="color:var(--text-dim);">Belum ada</span>'}
              </div>
            </div>`;
        });
    }
  </script>
  <script src="../assets/js/pwa-init.js"></script>
</body>
</html>
