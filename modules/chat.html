<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyrost - Messages</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="../dashboard.css">
    <link rel="stylesheet" href="social.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="chat-page-body">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/hyrost.png" alt="Logo">
                <h2>Hyrost</h2>
            </div>
            
            <div class="nav-section-label">Navigasi Utama</div>
            <nav class="sidebar-nav">
                <a href="../dashboard.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="../account/index.html" class="nav-item">
                    <i class="fas fa-user-circle"></i>
                    <span>Profil Saya</span>
                </a>
                <a href="store.html" class="nav-item">
                    <i class="fas fa-crown" style="color:var(--accent-gold);"></i>
                    <span>Toko Pangkat</span>
                </a>
                <a href="forum.html" class="nav-item">
                    <i class="fas fa-comments"></i>
                    <span>Forum</span>
                </a>
                <a href="showcase.html" class="nav-item">
                    <i class="fas fa-cubes-stacked" style="color:var(--accent-cyan);"></i>
                    <span>Galeri Build</span>
                </a>
                <a href="skin-studio.html" class="nav-item">
                    <i class="fas fa-person-running" style="color:var(--accent-pink, #ec4899);"></i>
                    <span>3D Skin Studio</span>
                </a>
                <a href="map.html" class="nav-item">
                    <i class="fas fa-map-location-dot" style="color:var(--accent-emerald-light);"></i>
                    <span>Live Map</span>
                </a>
                <a href="leaderboard.html" class="nav-item">
                    <i class="fas fa-trophy"></i>
                    <span>Leaderboard</span>
                </a>
                <a href="../inventory/inventory.html" class="nav-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Storage</span>
                </a>
                <a href="../marketplace/index.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Marketplace</span>
                </a>
                <a href="rewards.html" class="nav-item">
                    <i class="fas fa-calendar-check"></i>
                    <span>Daily Rewards</span>
                </a>
                <a href="wiki.html" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span>Wiki</span>
                </a>
                <a href="social.html" class="nav-item active">
                    <i class="fas fa-users"></i>
                    <span>Social</span>
                </a>
                <a href="support.html" class="nav-item">
                    <i class="fas fa-headset"></i>
                    <span>Support</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-info-circle"></i>
                    <span>Info</span>
                </a>
            </nav>
        </aside>

        <!-- Chat Interface -->
        <main class="chat-interface">
            <div class="chat-sidebar">
                <div class="chat-header">
                    <h3>Pesan</h3>
                    <button class="new-chat-btn"><i class="fas fa-edit"></i></button>
                </div>
                <div class="search-chat">
                    <input type="text" placeholder="Cari percakapan...">
                </div>
                <div class="conversation-list" id="conversation-list">
                    <!-- Dynamic conversation items loaded here -->
                </div>
                <div class="back-to-social">
                    <a href="social.html"><i class="fas fa-arrow-left"></i> Kembali ke Social Hub</a>
                </div>
            </div>

            <div class="chat-main" id="chat-main-area" style="display: none;">
                <div class="chat-user-header">
                    <div class="user-details">
                        <img id="active-chat-avatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="User">
                        <div>
                            <h3 id="active-chat-name">SteveCraft</h3>
                            <span class="status online" id="active-chat-status">Online</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button id="btn-block-active" title="Blokir Pengguna"><i class="fas fa-ban" style="color: #ef4444;"></i></button>
                    </div>
                </div>

                <div class="messages-area" id="messagesArea">
                    <!-- Messages render here -->
                </div>

                <div class="message-input-area">
                    <input type="text" id="msgInput" placeholder="Ketik pesan...">
                    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
            
            <div class="chat-main" id="chat-placeholder-area" style="flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: rgba(255,255,255,0.35);">
                <i class="fas fa-comments" style="font-size: 4rem; margin-bottom: 16px; opacity: 0.15;"></i>
                <p style="font-weight: 500;">Pilih teman di bilah kiri untuk memulai percakapan</p>
            </div>
        </main>
    </div>

    <!-- Global Toast Toast Notification System -->
    <div id="global-toast" class="toast-notification">
        <i id="toast-icon" class="fas fa-info-circle"></i>
        <span id="toast-message">Notifikasi</span>
    </div>

    <script src="../assets/js/mobileLayout.js"></script>
    <script src="chat.js?v=2"></script>
</body>
</html>
