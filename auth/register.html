<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
  <script src="/assets/js/stealthRouter.js"></script>
    <meta charset="UTF-8">
    <script>
        (function(){try{var p=window.location.pathname;if(p.endsWith("/index.html")){window.history.replaceState(null,"",p.slice(0,-10)||"/"+window.location.search+window.location.hash);}else if(p==="/index.html"||p==="index.html"){window.history.replaceState(null,"","/"+window.location.search+window.location.hash);}else if(p.endsWith(".html")){window.history.replaceState(null,"",p.slice(0,-5)+window.location.search+window.location.hash);}}catch(e){}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Hyrost - Create Account</title>
    <link rel="icon" type="image/png" href="/assets/images/hyrost.png">
    <link rel="stylesheet" href="/auth/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <div class="card-header">
                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
                <div class="logo-area">
                    <img src="/assets/images/hyrost.png" alt="Hyrost Logo" class="logo-img" style="width:54px; height:54px; border-radius:12px;">
                    <h1>HYROST</h1>
                    <p>Begin Your Adventure</p>
                </div>
            </div>
            
            <form id="register-form" class="register-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" placeholder="Create a strong password" required>
                        <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>
                
                <div style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 18px; line-height: 1.5; text-align: center;">
                    Dengan mendaftar, Anda menyetujui <a href="/?=tRm9S" target="_blank" style="color: #6366f1; text-decoration: underline;">Ketentuan Layanan</a> &amp; <a href="/?=pRv1C" target="_blank" style="color: #06b6d4; text-decoration: underline;">Kebijakan Privasi</a> Hyrost.
                </div>

                <button type="submit" class="register-btn">
                    <span>CREATE ACCOUNT</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="card-footer">
                <div id="message" style="display: none; margin-bottom: 15px; text-align: center;"></div>
                <p>Already have an account? <a href="/?=Lg8In">Login here</a></p>
                <div style="margin-top: 12px; font-size: 0.75rem; color: #6b7280; display: flex; justify-content: center; gap: 12px;">
                    <a href="/?=tRm9S" style="color: #9ca3af; text-decoration: none;">Terms of Service</a>
                    <span>•</span>
                    <a href="/?=pRv1C" style="color: #9ca3af; text-decoration: none;">Privacy Policy</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Google Sign-In Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/auth/register.js?v=20"></script>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
