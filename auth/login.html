<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(){try{var p=window.location.pathname;if(p.endsWith("/index.html")){window.history.replaceState(null,"",p.slice(0,-10)||"/"+window.location.search+window.location.hash);}else if(p==="/index.html"||p==="index.html"){window.history.replaceState(null,"","/"+window.location.search+window.location.hash);}else if(p.endsWith(".html")){window.history.replaceState(null,"",p.slice(0,-5)+window.location.search+window.location.hash);}}catch(e){}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Hyrost</title>
    <link rel="icon" type="image/png" href="../assets/images/hyrost.png" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="register-wrapper">
      <div class="register-card">
        <div class="card-header">
          <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
          <div class="logo-area">
            <img
              src="../assets/images/hyrost.png"
              alt="Hyrost Logo"
              class="logo-img"
              style="width:54px; height:54px; border-radius:12px;"
            />
            <h1>WELCOME BACK</h1>
            <p>Continue to your Realm</p>
          </div>
        </div>

        <form id="login-form" class="register-form">
          <div class="form-group">
            <label for="username"
              ><i class="fas fa-user"></i> Email / Username</label
            >
            <input
              type="text"
              id="username"
              placeholder="Enter your email or username"
              required
            />
          </div>
          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
              <i
                class="fas fa-eye-slash toggle-password"
                onclick="togglePasswordVisibility()"
              ></i>
            </div>
            <div style="text-align: right; margin-top: 8px">
              <a
                href="forgot-password.html"
                style="
                  color: #d4af37;
                  text-decoration: none;
                  font-size: 0.85rem;
                  transition: color 0.3s;
                "
                onmouseover="this.style.color='#fff'"
                onmouseout="this.style.color='#d4af37'"
                >Forgot Password?</a
              >
            </div>
          </div>

          <button type="submit" class="register-btn">
            <span>LOGIN</span>
            <i class="fas fa-sign-in-alt"></i>
          </button>

          <!-- GOOGLE LOGIN -->
          <div
            class="separator"
            style="
              margin: 20px 0;
              border-top: 1px solid rgba(255, 255, 255, 0.1);
              position: relative;
              text-align: center;
            "
          >
            <span
              style="
                background: #1a1a1a;
                padding: 0 10px;
                color: #888;
                position: relative;
                top: -10px;
                font-size: 0.8rem;
              "
              >OR</span
            >
          </div>
          <!-- Container for Google Button -->
          <div
            id="g_id_onload"
            data-client_id="808056546160-7ajmr4ef89tn617a0qi9u1hgv8oljss6.apps.googleusercontent.com"
            data-callback="handleCredentialResponse"
            data-auto_prompt="false"
          ></div>
          <div
            class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="sign_in_with"
            data-shape="rectangular"
            data-logo_alignment="left"
            data-width="320"
          ></div>
          <script
            src="https://accounts.google.com/gsi/client"
            async
            defer
          ></script>
        </form>

        <div class="card-footer">
          <div
            id="message"
            style="display: none; margin-bottom: 15px; text-align: center"
          ></div>
          <p>Don't have an account? <a href="register.html">Sign up here</a></p>
          <div style="margin-top: 12px; font-size: 0.75rem; color: #6b7280; display: flex; justify-content: center; gap: 12px;">
            <a href="../terms.html" style="color: #9ca3af; text-decoration: none;">Terms of Service</a>
            <span>•</span>
            <a href="../privacy.html" style="color: #9ca3af; text-decoration: none;">Privacy Policy</a>
          </div>
        </div>
      </div>
    </div>

    <script src="login.js?v=20"></script>
    <script>
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const icon = document.querySelector(".toggle-password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        } else {
          passwordInput.type = "password";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        }
      }
    </script>
  </body>
</html>
