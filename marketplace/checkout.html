<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyrost Market - Pembayaran</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="../dashboard.css">
    <link rel="stylesheet" href="../inventory/inventory.css">
    <link rel="stylesheet" href="shop_dashboard.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-checkout">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/hyrost.png" alt="Logo">
                <h2>Hyrost</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="../dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="../account/index.html" class="nav-item">
                    <i class="fas fa-user-circle"></i>
                    <span>Profile</span>
                </a>
                <a href="../question/index.html" class="nav-item">
                    <i class="fas fa-globe-asia"></i>
                    <span>World</span>
                </a>
                <a href="../modules/forum.html" class="nav-item">
                    <i class="fas fa-comments"></i>
                    <span>Forum</span>
                </a>
                <a href="../modules/leaderboard.html" class="nav-item">
                    <i class="fas fa-trophy"></i>
                    <span>Leaderboard</span>
                </a>
                <a href="../inventory/inventory.html" class="nav-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Storage</span>
                </a>
                <a href="shop.html" class="nav-item">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Shop</span>
                </a>
                <a href="auction.html" class="nav-item">
                    <i class="fas fa-gavel"></i>
                    <span>Auction</span>
                </a>
                <a href="../modules/role_shop.html" class="nav-item">
                    <i class="fas fa-user-tag"></i>
                    <span>Role Shop</span>
                </a>
                <a href="../modules/rewards.html" class="nav-item">
                    <i class="fas fa-calendar-check"></i>
                    <span>Daily Rewards</span>
                </a>
                <a href="../modules/wiki.html" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span>Wiki</span>
                </a>
                <a href="../modules/social.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Social</span>
                </a>
                <a href="../modules/support.html" class="nav-item">
                    <i class="fas fa-headset"></i>
                    <span>Support</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-info-circle"></i>
                    <span>Info</span>
                </a>
            </nav>

        <!-- Server Status Widget -->
        <div class="sidebar-widget server-status-widget">
            <div class="widget-header">
                <h3>Status Server</h3>
                <span class="status-dot online"></span>
            </div>
            <div class="widget-content">
                <p class="server-ip">play.hyrost.net</p>
                <p class="player-count"><i class="fas fa-users"></i> <span id="onlinePlayers">...</span> Online</p>
            </div>
        </div>
        </aside>

        <!-- Mobile Header -->
        <div class="mobile-header">
            <button id="sidebarToggle" class="icon-btn">
                <i class="fas fa-bars"></i>
            </button>
            <div class="mobile-logo">
                <img src="../assets/images/hyrost.png" alt="Logo">
                <h2>Hyrost</h2>
            </div>
        </div>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                     <a href="cart.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Keranjang</a>
                    <h1>Konfirmasi Pembayaran</h1>
                </div>
            </header>

            <div class="checkout-grid">
                <div class="checkout-form-section">
                    <div class="checkout-card">
                        <h3>Informasi Pengiriman</h3>
                        <form id="checkoutForm">
                            <div class="form-group">
                                <label>Nama Lengkap</label>
                                <input type="text" required class="market-input">
                            </div>
                            <div class="form-group">
                                <label>Username Minecraft</label>
                                <input type="text" required class="market-input">
                            </div>
                            <div class="form-group">
                                <label>Catatan (Opsional)</label>
                                <textarea class="market-input" rows="3"></textarea>
                            </div>
                            
                            <h3>Metode Pembayaran</h3>
                            <div class="payment-methods">
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="coins" checked>
                                    <span>Koin Hyrost</span>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="transfer">
                                    <span>Transfer Bank</span>
                                </label>
                            </div>

                            <button type="submit" class="btn-primary-market btn-block" style="margin-top: 20px;">
                                Bayar Sekarang
                            </button>
                        </form>
                    </div>
                </div>

                <div class="checkout-summary-section">
                    <div class="checkout-card summary">
                        <h3>Ringkasan Pesanan</h3>
                        <ul id="summaryList" class="summary-list">
                            <!-- Items from JS -->
                        </ul>
                        <div class="summary-total-row">
                            <span>Total</span>
                            <span id="checkoutTotal">Rp 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../inventory/inventory.js"></script>
    <script src="market.js"></script>
    <script src="../assets/js/server_status.js"></script>
</body>
</html>
